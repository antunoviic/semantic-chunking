[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "llm-chunker"
version = "0.1.0"
requires-python = ">=3.9"
description = "LLM-based semantic chunking library for RAG pipelines"
dependencies = [
    # HTTP client for Ollama
    "httpx>=0.27",
    # Sentence splitting
    "nltk>=3.8",
    # Language auto-detection
    "langdetect>=1.0.9",
    # Vector store
    "chromadb>=0.5",
    # Embeddings
    "sentence-transformers>=3.0",
    # PDF reading
    "pypdf>=4.0",
]

[project.optional-dependencies]
# Baseline chunking strategies for evaluation
eval = [
    "langchain-text-splitters>=0.3",
    "langchain-experimental>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-community>=0.3",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
]
