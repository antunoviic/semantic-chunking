[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-semantic-chunker"
# 0.2.x: QwenClient became OllamaClient (no alias) and the settings moved into
# ChunkerConfig, a breaking change against the 0.1.0 on TestPyPI. Patch releases
# since then change documentation, packaging metadata and the pipeline only;
# a version that is on an index is never rebuilt with different content.
version = "0.2.2"
requires-python = ">=3.9"
description = "LLM-based semantic chunking library for RAG pipelines"
readme = "README.md"
authors = [{ name = "Ivan Antunovic" }]
# PEP 639: SPDX-Ausdruck statt Classifier. Der alte
# "License :: OSI Approved :: MIT License" ist damit unzulaessig.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["chunking", "rag", "retrieval", "llm", "ollama", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

# Chunking a string needs exactly these three. Everything else a user might
# want — a vector store, PDF reading, a framework adapter — is an extra, so
# `pip install llm-semantic-chunker` stays small.
dependencies = [
    # HTTP client for Ollama
    "httpx>=0.27",
    # Sentence splitting
    "nltk>=3.8",
    # Language auto-detection
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
# Framework adapters. The imports are visible in the example code, but nobody
# who only wants to chunk text has to download either framework.
langchain = ["langchain-text-splitters>=0.3"]
# llama-index-core pulls in `banks`, which uses PEP 604 syntax and therefore
# needs Python 3.10 — the library itself still runs on 3.9.
llamaindex = ["llama-index-core>=0.11"]

# PDF input via app/document_reader.py
pdf = ["pypdf>=4.0"]
# Vector store used by llm_semantic_chunker/vectorstore.py and the evaluation harness
vectorstore = ["chromadb>=0.5"]

# Everything the thesis evaluation harness needs on top: the rule-based
# baselines, LangChain's SemanticChunker and the plots. Embeddings come from
# Ollama (bge-m3), so no torch. Not needed to use the library.
eval = [
    "chromadb>=0.5",
    "pypdf>=4.0",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-experimental>=0.3",
    "matplotlib>=3.8",
]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/antunoviic/semantic-chunking"
Issues = "https://github.com/antunoviic/semantic-chunking/issues"

[tool.setuptools.packages.find]
# Only the library ships. app/, eval/, tools/ and thesis/ are the evaluation
# harness behind the bachelor thesis — they stay in the repository but are not
# part of the distribution, so installing this package cannot put top-level
# modules named `app` or `eval` on a user's import path.
include = ["llm_semantic_chunker*"]
